<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="font-family:'Bricolage Grotesque';font-weight:700;font-size:{{ fs }};line-height:1;letter-spacing:{{ ls }};color:{{ ink }};display:inline-flex;align-items:baseline;white-space:pre;font-variation-settings:'opsz' 96">{{ k }}<sc-if value="{{ firstPill }}" hint-placeholder-val="{{ true }}"><span style="position:relative;display:inline-block;margin:0 0.015em">ı<span style="position:absolute;left:50%;top:{{ dotTop }};width:0.24em;height:0.13em;margin-left:-0.12em;border-radius:999px;background:{{ dot1 }}"></span></span></sc-if><sc-if value="{{ firstPlain }}" hint-placeholder-val="{{ false }}">i</sc-if>{{ mid }}<sc-if value="{{ secondPlain }}" hint-placeholder-val="{{ false }}">i</sc-if><sc-if value="{{ secondPill }}" hint-placeholder-val="{{ true }}"><span style="position:relative;display:inline-block;margin:0 0.015em">ı<span style="position:absolute;left:50%;top:{{ dotTop }};width:0.24em;height:0.13em;margin-left:-0.12em;border-radius:999px;background:{{ dot2 }}"></span></span></sc-if>{{ end }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:160},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#211C18&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot1&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2401E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot2&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2401E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lower&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 64;
    const lower = this.props.lower ?? false;
    const mono = this.props.mono ?? false;
    const ink = this.props.ink ?? '#211C18';
    return {
      k: lower ? 'k' : 'K',
      mid: mono ? '' : 'v',
      end: mono ? '' : 'en',
      firstPill: mono || this.props.pill !== 'second',
      firstPlain: !mono && this.props.pill === 'second',
      secondPill: !mono && this.props.pill !== 'first',
      secondPlain: !mono && this.props.pill === 'first',
      fs: s + 'px',
      ls: s >= 40 ? '-0.04em' : '-0.025em',
      dotTop: s >= 40 ? '0.09em' : '0.07em',
      ink,
      dot1: this.props.dot1 ?? '#C2401E',
      dot2: this.props.dot2 ?? (this.props.dot1 ?? '#C2401E')
    };
  }
}
</script>
</body>
</html>
