<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="font-family:'Bricolage Grotesque';font-weight:700;font-size:{{ fs }};line-height:1;letter-spacing:{{ ls }};color:{{ ink }};display:inline-flex;align-items:baseline;white-space:nowrap;transform:{{ tf }}">Koudm<span style="position:relative;display:inline-block">ı<span style="position:absolute;left:50%;top:{{ dotTop }};width:0.30em;height:0.13em;margin-left:-0.15em;border-radius:999px;background:{{ dot }}"></span></span>n</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:160},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#211C18&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2401E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;transform&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 64;
    return {
      fs: s + 'px',
      ls: s >= 40 ? '-0.045em' : '-0.03em',
      dotTop: s >= 40 ? '0.09em' : '0.07em',
      ink: this.props.ink ?? '#211C18',
      dot: this.props.dot ?? '#C2401E',
      tf: this.props.transform ?? 'none'
    };
  }
}
</script>
</body>
</html>
